name: CMake (Windows)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  BUILD_TYPE: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    # 1. CUDA 툴킷 설치 (이게 핵심입니다!)
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.21
      with:
        cuda: '12.1.0'
        method: 'network'
    
    - name: Unshallow vcpkg submodule
      shell: pwsh
      run: |
        cd external/vcpkg
        git fetch --unshallow 2>$null; if (-not $?) { Write-Host "Already unshallowed or fetch failed" }
        exit 0
    
    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        Push-Location external/vcpkg
        .\bootstrap-vcpkg.bat -disableMetrics
        Pop-Location

    # 2. CMake 설정 (CUDA 경로를 수동으로 지정해줍니다)
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build `
          -DCMAKE_TOOLCHAIN_FILE="external\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_CUDA_COMPILER="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.1\bin\nvcc.exe"

    - name: Build
      shell: pwsh
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 4

    # 3. 결과물 저장 (성공하면 여기서 다운로드!)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: alien-windows-x64
        path: build/${{ env.BUILD_TYPE }}/*.exe

name: windows-ci

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.21
      with:
        cuda: '12.4.1'

    - name: Unshallow and Bootstrap
      run: |
        git -C external/vcpkg fetch --unshallow
        ./external/vcpkg/bootstrap-vcpkg.bat

    - name: Configure CMake
      run: |
        cmake -B build -S . ^
        -DCMAKE_TOOLCHAIN_FILE=external/vcpkg/scripts/buildsystems/vcpkg.cmake ^
        -DVCPKG_TARGET_TRIPLET=x64-windows ^
        -DENABLE_CUDA=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Copy CUDA DLL to Release
      run: |
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cudart64_12.dll" "build\Release\"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: alien-han-full-package
        path: |
          build/Release/
          build/vcpkg_installed/x64-windows/bin/*.dll
